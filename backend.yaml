apiVersion: apps/v1 
kind: StatefulSet 
metadata:
  name: backend-deployment 
  namespace: retail 
spec:
  replicas: 1
  minReadySeconds: 10 
  selector: 
    matchLabels:
      apps: retails 
  template: 
    metadata:
      labels:
        apps: retails 
    spec:
      
      terminationGracePeriodSeconds: 10
      containers:
        - name: backend-cont 
          image: mysql
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: "100m"
              memory: "218Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"
            - name: MYSQL_DATABASE
              value: "capsule_db"
            - name: MYSQL_USER
              value: "capsule_user"
            - name: MYSQL_PASSWORD
              value: "capsule_password"
          volumeMounts:
            # - name: my-storage 
            #   mountPath: /var/lib/mysql
            - name: mysql-q
              mountPath: /docker-entrypoint-initdb.d 
      volumes:
      - name: mysql-q
        configMap:
          name: mysql-init 
