apiVersion: apps/v1 
kind: StatefulSet 
metadata:
  name: backend-deployment 
  namespace: retail 
spec:
  replicas: 1
  minReadySeconds: 10 
  selector: 
    matchLabels:
      apps: retails 
  template: 
    metadata:
      labels:
        apps: retails 
    spec:
      containers:
        - name: backend-cont 
          image: mysql
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: "100m"
              memory: "218Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: retail-secret 
                  key: PORT
            - name: EMAIL_SERVICE
              valueFrom:
                secretKeyRef: 
                  name: retail-secret 
                  key: EMAIL_SERVICE
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: retail-secret 
                  key: EMAIL_USER
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: retail-secret 
                  key: EMAIL_PASS
            - name: SUPPORT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: retail-secret 
                  key: SUPPORT_EMAIL
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: retail-secret 
                  key: ADMIN_USERNAME
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: retail-secret 
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retail-secret 
                  key: ADMIN_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: DB_NAME
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: retail-config
                  key: DB_PORT
            
    